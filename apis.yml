name: Crunchbase
kind: company
description: >-
  Crunchbase is a leading source of private and public company, funding, and
  investor data - firmographics, funding rounds, acquisitions, investors, people,
  events, and AI-generated predictions and insights across the global startup and
  business landscape. The Crunchbase Data API (REST v4, base
  https://api.crunchbase.com/v4/data) exposes this graph programmatically through
  Entity Lookup, Search, Autocomplete, and Deleted Entities across 43 entity
  collections, and is published as six package-scoped OpenAPI 3.0.1 documents -
  Firmographic, Core Financials, Advanced Financials, Insights, Predictions, and
  Predictions & Insights - discoverable through an RFC 9727 api-catalog at
  data.crunchbase.com. Crunchbase also ships a first-party remote MCP server at
  mcp.crunchbase.com over Streamable HTTP with fourteen documented tools,
  authenticated with OAuth 2.1 + PKCE and sold as per-user MCP seats. The REST API
  is read-only and authenticated with a single account-level API key (user_key
  query parameter or X-cb-user-key header); which of the six packages that key is
  provisioned against determines which operations it can call. Access is
  subscription-gated with no published pricing - the full API requires a
  Crunchbase Enterprise or Applications licence, with a reduced Basic API for
  Crunchbase Basic plan holders.
