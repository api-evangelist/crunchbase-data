x-enrichment:
  date: '2026-08-14'
  status: enriched
  artifacts_added: 34
  pass: local-v1
  notes: >-
    Contract discovery win. The RFC 9727 api-catalog at
    https://data.crunchbase.com/.well-known/api-catalog indexes six first-party
    OpenAPI 3.0.1 documents (109 unique operations, every one with an operationId,
    summary, tags and 200/400/404/500 responses); all six were fetched 200 and saved
    verbatim to openapi/. They replace the four hand-modelled 6-operation specs from
    the first round, which are archived under openapi/_superseded-modeled/. Also
    found: a first-party remote MCP server at https://mcp.crunchbase.com with 14
    documented tools, a real llms.txt, an RFC 9116 security.txt with a Vulnerability
    Disclosure Program, and RFC 8414 + RFC 9728 OAuth metadata. Honest zeros
    recorded: no official SDK in any registry (all 17 github.com/crunchbase repos are
    forks), no A2A agent card, no AsyncAPI or webhook surface, no status page, no
    trust center or named certifications, no sandbox, no CLI, no idempotency
    contract, and no published price for API or MCP access. The PostmanCollection and
    OpenCollection pointers from the previous round were dropped: those files were
    generated from the now-superseded modelled specs, and Crunchbase publishes no
    public Postman workspace.
