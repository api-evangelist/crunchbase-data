description: >-
  Crunchbase publishes NO first-party client library in any language. The GitHub
  organization github.com/crunchbase exists and is public, but all 17 of its
  repositories are forks of third-party projects (swagger-codegen,
  openapi-generator, Kafka connectors, Airflow, poetry) - none is a Crunchbase SDK.
  The developer documentation index (llms.txt, 473 lines) contains no SDK or client
  library page. Every package below is a community wrapper, and every one of them
  is abandoned: the newest release in the set is from December 2020, and three of
  the five predate the v4 Data API entirely, so they target the retired v2/v3 REST
  surface and cannot call the current API. This is recorded as an honest zero for
  official SDK coverage, not as a gap in the search.
