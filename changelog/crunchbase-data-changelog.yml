description: >-
  Crunchbase publishes a dated monthly "Product Updates and Release Notes" page on its
  marketing site. It is the only public dated record of what changed in the API. Each
  item is tagged with where it lands - "Available in: API", "API and UI", or a named
  package such as "API (Predictions & Insights)" - which makes it usable as an API
  changelog even though it is not hosted on the developer docs host, carries no
  version numbers, and offers no RSS/Atom feed or per-entry permalinks.
