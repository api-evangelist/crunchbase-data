- tool: cb_expert_build_search
  category: expert
  rest:
  - searchOrganizations
  - searchFundingRounds
  - searchPeople
  binding: composite
  confidence: low
  note: >-
    Compiles natural language into a structured Crunchbase search. Crunchbase
    documents the productive pattern as running the compiled predicates through
    cb_search_query afterwards, so the output binds to the same search operations -
    but the compilation step itself is server-side and has no REST equivalent.
mcp_only:
- tool: cb_expert_query_answer
  reason: >-
    Natural-language question answering over live Crunchbase data. Server-side
    composite - interprets, plans and executes multiple queries and returns a
    synthesised answer with a request_id. No public REST operation.
- tool: cb_expert_query_domain
  reason: >-
    Meta-questions about the data domain (what entities/fields/relationships exist,
    whether a question is answerable). The closest REST analogue is the
    auth-gated getFieldsMetadata, but it returns a field catalogue, not
    answerability diagnostics or suggested analytical paths.
- tool: cb_expert_resolve_entity
  reason: >-
    Entity disambiguation with domain-priority matching, free-text context and an
    auto-fetched profile. autocompletes does name matching only; the ranking,
    context handling and domain precedence are server-side and MCP-only.
- tool: cb_expert_submit_feedback
  reason: >-
    Writes feedback against a prior expert request_id and can trigger a query
    rewrite. No REST endpoint exists for expert-service feedback.
- tool: cb_reference
  reason: >-
    Returns Markdown schema documentation, valid operators, example predicates, enum
    values and live sample data per field. Partially overlaps the auth-gated
    getFieldsMetadata but is a documentation service, not a data endpoint.
- tool: cb_list_query
  reason: Crunchbase saved lists are a platform (www.crunchbase.com) feature; the Data API exposes no list collection.
- tool: cb_list_create
  reason: Write operation against Crunchbase lists. The Data API is read-only - it declares no POST outside /data/searches/.
- tool: cb_list_add_entities
  reason: Write operation against Crunchbase lists. No REST equivalent.
- tool: cb_list_get
  reason: Reads list membership. No REST equivalent.
- tool: cb_metering_get_state
  reason: >-
    Returns caller-visible meter/quota state. The API Dashboard (announced June 2026)
    is a UI surface for Enterprise users; no REST metering endpoint is published.
rest_only:
- capability: Deleted entities / deltas
  operations:
  - getDeletedEntities
  - getDeletedEntitiesForCollection
  note: >-
    Reconciliation feed for downstream databases. No MCP tool exposes deletions, so
    an agent cannot detect that an entity has left the graph.
- capability: Self-describing metadata
  operations:
  - getFieldsMetadata
  - getOpenApiSpecJson
  - getOpenApiSpecYaml
  note: >-
    GET /md/applications/crunchbase/{fields,openapi.json,openapi.yaml}. The API can
    serve its own OpenAPI to a licensed key; cb_reference is the MCP-side answer to
    the same need but returns Markdown, not a spec.
