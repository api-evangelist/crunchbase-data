generated: '2026-08-14'
method: derived
source: >-
  mcp/crunchbase-data-mcp.yml (tools transcribed from
  https://data.crunchbase.com/docs/tool-reference) bound against the six OpenAPI
  documents in openapi/, harvested from
  https://data.crunchbase.com/.well-known/api-catalog
description: >-
  Binds each published Crunchbase MCP tool to the REST operation(s) that back it.
  The two surfaces are NOT the same size in either direction. Fourteen MCP tools
  collapse 109 REST operations - one cb_entity_get parameterised by entity_def_id
  stands in for 43 per-collection lookups plus 17 card endpoints, and one
  cb_search_query stands in for 43 per-collection search endpoints - while nine of
  the fourteen tools (the five expert tools, cb_reference, and the four list tools)
  have no public REST equivalent at all. Confidence is capped at medium for every
  row because the live MCP schemas are OAuth-gated (tools/list returned HTTP 401 on
  2026-08-14), so the binding is by documented semantics and parameter names, not by
  a fetched inputSchema.
surfaces:
  openapi:
    files:
    - openapi/crunchbase-data-firmographic-openapi.yml
    - openapi/crunchbase-data-core-financials-openapi.yml
    - openapi/crunchbase-data-advanced-financials-openapi.yml
    - openapi/crunchbase-data-insights-openapi.yml
    - openapi/crunchbase-data-predictions-openapi.yml
    - openapi/crunchbase-data-predictions-insights-openapi.yml
    discovery: https://data.crunchbase.com/.well-known/api-catalog
    base_url: https://api.crunchbase.com/v4
    gated: false
    note: >-
      The documents are anonymously fetchable; calling the API is not - every
      api.crunchbase.com request needs X-cb-user-key and a licensed package.
  graphql:
    present: false
    note: Crunchbase publishes no GraphQL surface for the Data API.
  mcp:
    url: https://mcp.crunchbase.com
    transport: Streamable HTTP
    gated: true
    note: >-
      POST tools/list returned HTTP 401 (OAuth 2.1 required). Tool names,
      descriptions and parameters below come from the provider's published Tool
      Reference page, not from an authenticated introspection.
