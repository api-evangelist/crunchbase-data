description: >-
  Crunchbase ships a first-party REMOTE MCP server at https://mcp.crunchbase.com
  over Streamable HTTP, authenticated with OAuth 2.1 + PKCE against the user's own
  Crunchbase account. It is not a wrapper over a slice of the REST API: Crunchbase
  states that everything available through the Data API is available through MCP,
  plus expert (natural-language) tools and list write operations that have no REST
  equivalent. Access is sold per workspace and assigned per user as an "MCP seat";
  an MCP seat carries Crunchbase's highest level of data access, including
  predictions and insights.
server:
  name: Crunchbase
  transport: http
  transport_detail: Streamable HTTP
  url: https://mcp.crunchbase.com
  docs: https://data.crunchbase.com/docs/mcp-overview
  tool_reference: https://data.crunchbase.com/docs/tool-reference
deployment:
  mode: remote
  endpoint: https://mcp.crunchbase.com
  auth: oauth
  verified: probed
  note: >-
    Remote only. Crunchbase publishes no npx/stdio package - the server is a hosted
    HTTPS endpoint an MCP client POSTs to. Probed 2026-08-14: POST tools/list to
    https://mcp.crunchbase.com/mcp returned HTTP 401 with an empty JSON object, and
    https://mcp.crunchbase.com/.well-known/oauth-protected-resource returned 200
    with resource=https://mcp.crunchbase.com and
    authorization_servers=[https://www.crunchbase.com]. The live tool schemas are
    therefore auth-gated; the tools[] below are transcribed from the provider's own
    published Tool Reference, not from an authenticated tools/list.
authentication:
  scheme: OAuth 2.1
  pkce: true
  pkce_methods:
  - S256
  - plain
  authorization_server: https://www.crunchbase.com
  authorization_endpoint: https://www.crunchbase.com/oauth/authorize
  token_endpoint: https://oauth.crunchbase.com/token
  revocation_endpoint: https://oauth.crunchbase.com/revoke
  grant_types:
  - authorization_code
  - refresh_token
  scopes:
  - offline_access
  - lists.read
  client_registration:
    cimd: true
    note: >-
      Clients supporting Client ID Metadata Documents connect with no registration.
      Dynamic Client Registration (DCR) is explicitly NOT supported; clients without
      CIMD need a pre-registered client_id/client_secret issued by a Crunchbase CSM,
      retrieved under Settings > Integrations > MCP.
    dcr: false
access:
  model: per-workspace purchase, per-user MCP seat
  seat_grants: highest level of Crunchbase data access, including predictions and insights
  programmatic: >-
    Headless / backend / non-interactive MCP access is offered but arranged
    individually through a Customer Success Manager; it is not self-serve.
  docs: https://data.crunchbase.com/docs/managing-mcp-access
clients_supported:
- Claude (web, desktop, mobile)
- Claude Code
- ChatGPT (Developer Mode plugins)
- VS Code (GitHub Copilot Chat, Agent mode)
- Perplexity (pre-registered OAuth client)
- Mistral Vibe (pre-registered OAuth client)
- any client implementing the current MCP specification
tool_count: 14
tools:
- name: cb_expert_query_answer
  category: expert
  description: >-
    Answers a natural-language question using live Crunchbase data; the expert
    service interprets the question, constructs and executes the queries, and
    returns an answer with supporting results. Each response carries a request_id
    needed for cb_expert_submit_feedback.
  write: false
- name: cb_expert_build_search
  category: expert
  description: >-
    Translates a natural-language description of the entities you want into a
    compiled, structured Crunchbase search, handling field resolution, operator
    selection and value formatting.
  write: false
- name: cb_expert_query_domain
  category: expert
  description: >-
    Answers meta-questions about the shape of the Crunchbase data domain - what
    entities, fields and relationships exist, and whether a draft question is
    answerable. Does not query records.
  parameters:
  - name: intent
    type: string
    notes: '"discover" (default) browses the domain catalog; "assess" evaluates a draft question.'
  - name: question
    type: string
    notes: Required for assess, optional for discover.
  - name: focus
    type: array
    notes: Up to 10 focus tokens to narrow scope.
  - name: max_suggestions
    type: integer
    notes: 1-5, default 5.
  write: false
- name: cb_expert_resolve_entity
  category: expert
  description: >-
    Disambiguates an entity name against the Crunchbase catalog and resolves it to
    a canonical entity; returns a single match when confident, otherwise a ranked
    candidate list.
  parameters:
  - name: name
    type: string
    notes: Required, 1-100 characters.
  - name: collection_id
    type: string
    notes: 'Collection to search within, e.g. organizations, people, principal.investors. Defaults to organizations + people.'
  - name: domains
    type: array
    notes: Website domains; strongly preferred - domain lookup takes precedence over name matching.
  - name: context
    type: string
    notes: Up to 10,000 characters of free-text background to improve ranking.
  - name: cb_entity_get
    type: object|null
    notes: Object with field_ids/card_ids/related_entity_limit to customize the auto-fetched profile, or null to disable.
  write: false
- name: cb_expert_submit_feedback
  category: expert
  description: >-
    Records user feedback on a previous cb_expert_query_answer result; negative
    feedback may trigger the expert service to rewrite the query and return
    corrected results.
  parameters:
  - name: subject_request_id
    type: string
    notes: Required - the request_id from the answer being rated.
  - name: sentiment
    type: string
    notes: Required - positive, neutral or negative.
  - name: feedback
    type: string
    notes: Optional elaboration up to 1,000 characters.
  write: false
- name: cb_reference
  category: structured
  description: >-
    The schema reference for everything else. Returns Markdown documentation for a
    given path; empty path or "index" returns the full navigable index. Paths
    include entities, entities/<entity_def_id>/fields[/<field_id>],
    entities/<entity_def_id>/cards, field_types, operators, and
    guidance/{search_query,build_search,query_answer}.
  write: false
- name: cb_entity_autocomplete
  category: structured
  description: >-
    Searches Crunchbase entities by name and returns matching identifiers with
    short descriptions - the way to obtain valid identifiers (including locations
    and categories used as filter values) before calling other tools.
  parameters:
  - name: query
    type: string
    notes: Required.
  - name: collection_ids
    type: string
    notes: Comma-separated collections; blank searches all.
  - name: limit
    type: integer
    notes: Default 10, max 25.
  write: false
- name: cb_entity_get
  category: structured
  description: >-
    Retrieves the full profile for one already-identified entity - fields plus
    relationship cards. Documented as the most expensive call in the toolset.
  parameters:
  - name: entity_id
    type: string
    notes: Required. UUID or permalink; must be a real identifier obtained from another tool.
  - name: entity_def_id
    type: string
    notes: 'Entity type, e.g. organization, person, funding_round. Defaults to organization.'
  - name: field_ids
    type: array
    notes: Specific fields; defaults to all. Pass [] to skip top-level fields.
  - name: card_ids
    type: array
    notes: Specific cards; defaults to all readable cards.
  - name: related_entity_limit
    type: integer
    notes: Max total related entities across cards. Default 100, max 2,000.
  - name: after_id
    type: string
    notes: Card pagination cursor (identifier.uuid of the last entity in the previous response).
  write: false
- name: cb_search_query
  category: structured
  description: >-
    Executes a structured search and returns matching entities with the requested
    fields - the deterministic, repeatable precision instrument.
  parameters:
  - name: collection_id
    type: string
    notes: 'Required, e.g. organization.companies, funding_rounds.'
  - name: predicates
    type: array
    notes: 'Flat {field_id, operator_id, values} filters. Mutually exclusive with query.'
  - name: query
    type: array
    notes: Recursive query items with type predicate or sub_query. Mutually exclusive with predicates.
  - name: field_ids
    type: array
    notes: Columns to return.
  - name: order
    type: array
    notes: '{field_id, sort: asc/desc, nulls: first/last} - fields must be sortable.'
  - name: limit
    type: integer
    notes: Default 20; maximum depends on access, up to 1,000.
  - name: after_id
    type: string
    notes: Pagination cursor - UUID of the last entity from the previous page.
  write: false
- name: cb_list_query
  category: lists
  description: Returns all saved lists owned by the caller, with names, entity counts and timestamps.
  write: false
- name: cb_list_create
  category: lists
  description: Creates a new empty list from a single name parameter.
  write: true
- name: cb_list_add_entities
  category: lists
  description: Appends entities to an existing list, from list_id and an array of entity_ids.
  write: true
- name: cb_list_get
  category: lists
  description: Returns the entity identifiers in a list, with after_id for pagination.
  write: false
- name: cb_metering_get_state
  category: utility
  description: >-
    Returns the caller-visible meter states for the current user - which limits
    apply and how they affect each tool. Takes no parameters.
  write: false
notes: >-
  Crunchbase documents cb_list_create and cb_list_add_entities as the toolset's only
  write operations and recommends keeping them on manual approval. The MCP surface is
  a genuine superset of the REST surface: the five cb_expert_* tools, cb_reference,
  the four cb_list_* tools and cb_metering_get_state have no public REST operation in
  the six published OpenAPI documents - see mcp/crunchbase-data-tool-crosswalk.yml.
