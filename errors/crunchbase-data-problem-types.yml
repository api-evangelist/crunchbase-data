generated: '2026-08-14'
method: derived
source: >-
  openapi/crunchbase-data-*-openapi.yml (components.responses Generic*Error), plus
  the live 401/426/429 shapes observed probing https://api.crunchbase.com and
  https://data.crunchbase.com/docs/using-the-api
format: proprietary
format_note: >-
  NOT RFC 9457. No operation in any of the six published specs declares
  application/problem+json. Every declared error returns application/json against a
  schema named Errors, whose only property is a string `value` described as
  "Developer friendly error message" - so the machine-readable error contract is a
  free-text string with no code, no type URI and no field-level detail. The live API
  returns a richer shape than the spec promises: probing api.crunchbase.com without a
  key returned a JSON ARRAY of objects carrying status, code and message
  ([{"status":401,"code":"LA401","message":"Unauthorized user_key"}]). That array
  envelope and the LA401 code appear nowhere in the specs or the error documentation.
envelope:
  declared:
    media_type: application/json
    schema: Errors
    shape: '{ "value": "<developer friendly error message>" }'
    source: openapi/crunchbase-data-predictions-insights-openapi.yml#/components/schemas/Errors
  observed:
    media_type: application/json
    shape: '[ { "status": <int>, "code": "<string>", "message": "<string>" } ]'
    source: 'live probe of https://api.crunchbase.com/v4/data/autocompletes?query=tesla (2026-08-14, no key)'
    note: Observed on the 401 path only; other statuses could not be exercised without a licensed key.
problems:
- status: 400
  title: Bad Request
  declared_in_spec: true
  spec_response: GenericBadRequestError
  applies_to: all 109 operations across all six packages
  remediation: >-
    Malformed request. For POST /data/searches/{collection} check the query
    predicates - the docs identify guessed operator_ids and display-name values in
    identifier-valued fields as the dominant cause. Resolve locations and categories
    to permalinks first via GET /data/autocompletes.
- status: 404
  title: Not Found
  declared_in_spec: true
  spec_response: GenericNotFoundError
  applies_to: 103 of 109 operations (every entity lookup, card lookup and search)
  remediation: >-
    The UUID or permalink does not resolve in the requested collection. Confirm the
    entity_id with GET /data/autocompletes and confirm the collection matches the
    entity's entity_def_id.
- status: 500
  title: Request Failed
  declared_in_spec: true
  spec_response: GenericInternalServerError
  applies_to: all 109 operations across all six packages
  remediation: Retry with exponential backoff and jitter. Persistent 500s should go to your Crunchbase CSM.
- status: 401
  title: Unauthorized user_key
  code: LA401
  declared_in_spec: false
  observed: true
  source: 'live probe of https://api.crunchbase.com (2026-08-14)'
  remediation: >-
    Missing, invalid, or unlicensed API key. Pass the key as the X-cb-user-key header
    (preferred) or the user_key query parameter. Keys are issued with an Enterprise,
    Applications or Basic license; a key valid for one package does not unlock
    another.
  note: >-
    Not declared by any operation in any of the six specs, yet it is the response
    every unauthenticated caller actually receives - the single largest gap between
    the published contract and the deployed API.
- status: 426
  title: Upgrade Required - HTTPS mandatory
  declared_in_spec: false
  documented: true
  source: https://data.crunchbase.com/docs/using-the-api
  remediation: Reissue the request over HTTPS. Plain HTTP is rejected outright.
- status: 429
  title: Too Many Requests
  declared_in_spec: false
  documented: true
  source: https://data.crunchbase.com/docs/using-the-api
  remediation: >-
    Rate limit of 200 calls per minute exceeded. Back off and retry. Crunchbase
    publishes no RateLimit-* or Retry-After header contract, so a client has to infer
    the window - see rate-limits/crunchbase-data-rate-limits.yml.
gaps:
- >-
  Three of the six statuses a real client will encounter (401, 426, 429) are absent
  from all 109 operations in all six specs.
- >-
  The Errors schema declares a single free-text `value` property, so an agent cannot
  branch on an error programmatically from the contract alone.
- >-
  No error-code registry is published. LA401 is the only code observed and it is
  undocumented.
