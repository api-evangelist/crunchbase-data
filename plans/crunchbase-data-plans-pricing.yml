description: >-
  Crunchbase publishes NO price for API access. Not a number, not a starting-from, not
  a per-call rate - the pricing page (about.crunchbase.com/pricing) covers the web
  product only and its API and MCP entries route to "Talk to Sales". What Crunchbase
  DOES publish, and publishes precisely, is the SHAPE of what you are buying: three
  data packages (Fundamentals, Insights, Predictions) plus MCP seats, and each package
  is backed by its own machine-readable OpenAPI document, so the exact operation count
  a tier unlocks is verifiable even though its cost is not. That is a genuinely useful
  half-transparency and it is recorded here as such: plan structure known, plan pricing
  withheld.
notes: >-
  Every price below is "contact sales" because that is what Crunchbase publishes. No
  dollar figure appears on any public Crunchbase page for API or MCP access, and none
  is asserted here. The operation counts are read from the six OpenAPI documents
  indexed at https://data.crunchbase.com/.well-known/api-catalog and are exact. A
  reduced Basic API is available to holders of the paid Crunchbase Basic plan. Standard
  Crunchbase subscription tiers (Pro, Business) surface the web product and do not
  include full API access. All API tiers share the 200 calls-per-minute rate limit.
  Legacy API keys are being migrated onto these packages - each legacy key was mapped
  to the package mirroring its previous plan.
